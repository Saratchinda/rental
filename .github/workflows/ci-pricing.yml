name: CI/CD - pricing-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pricing-service

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/pricing-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/pricing-service
        run: |
          mkdir -p build/test-results
          python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-test-results
          path: apps/pricing-service/build/test-results/

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/pricing-service
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: apps/pricing-service
        run: python -m ruff check app tests

      - name: Ruff format check
        working-directory: apps/pricing-service
        run: python -m ruff format --check app tests

  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, quality]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/pricing-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan Docker image with Trivy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan-pricing